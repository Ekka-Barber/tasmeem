<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>Acme AI</title>
  <style>
    body { font-family: Inter, system-ui, sans-serif; background: #f5f1ea; color: #000; line-height: 1.3; }
    .hero { min-height: 100vh; background: linear-gradient(135deg, #7c3aed 0%, #3b82f6 100%); text-align: center; }
    .hero h1 { background: linear-gradient(90deg, #a855f7, #06b6d4); -webkit-background-clip: text; background-clip: text; color: transparent; letter-spacing: -0.06em; }
    .eyebrow { text-transform: uppercase; letter-spacing: 0.2em; font-size: 12px; }
    .card { border-radius: 28px; box-shadow: 0 0 40px rgba(124, 58, 237, 0.6); border: 1px solid #eee; backdrop-filter: blur(12px); transition: all 300ms cubic-bezier(0.68, -0.55, 0.265, 1.55); }
    .callout { border-left: 4px solid #6366f1; }
    .reveal { opacity: 0; }
    .blob { position: absolute; filter: blur(80px); background: radial-gradient(circle at center, #8b5cf6, transparent); }
    .toast { z-index: 9999; }
    @keyframes grow { from { width: 0; transform: scale(0); } to { width: 100%; transform: scale(1); } }
    button:focus { outline: none; }
  </style>
</head>
<body>
  <section class="hero">
    <span class="badge">✨ New · v2.0</span>
    <p class="eyebrow">Introducing</p>
    <h1>Unlock the power of <span class="accent">seamless</span> AI</h1>
    <p>Lorem ipsum dolor sit amet. Trusted by 50,000+ teams — with 99.99% uptime — and loved by developers.</p>
    <div onClick="go()">Get started</div>
  </section>
  <div class="window"><span style="background:#ff5f56"></span><span style="background:#ffbd2e"></span><span style="background:#27c93f"></span></div>
  <section>
    <p class="eyebrow">01 · Features</p>
    <div class="card reveal"><h3>🚀 Blazing fast</h3><p>It's not just a tool. It's a movement.</p></div>
    <img src="https://via.placeholder.com/600x400">
  </section>
</body>
</html>
